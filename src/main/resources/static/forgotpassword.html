<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Forgot Password | StyleSync </title>
    <style>
        * { box-sizing: border-box; }
        body { margin: 0; min-height: 100vh; display: flex; align-items: center;
            justify-content: center; padding: 24px; font-family: Arial, sans-serif;
            background: #faf8f5; color: #222222; }
        .card { width: 100%; max-width: 420px; padding: 36px; background: #ffffff;
            border: 1px solid #eeeeee; border-radius: 12px;
            box-shadow: 0 12px 35px rgba(0,0,0,0.06); }
        .logo { margin-bottom: 24px; text-align: center; font-size: 27px; font-weight: 800; }
        .logo span { color: #a45b45; }
        h1 { margin: 0 0 10px; text-align: center; font-size: 24px; }
        .subtitle { margin: 0 0 24px; color: #777777; text-align: center; line-height: 1.5; }
        label { display: block; margin: 18px 0 8px; font-size: 14px; font-weight: 600; }
        input { width: 100%; padding: 13px; border: 1px solid #dddddd; border-radius: 5px; font-size: 15px; }
        input:focus { outline: 2px solid #a45b45; outline-offset: 1px; }
        button { width: 100%; margin-top: 24px; padding: 14px; border: none; border-radius: 5px;
            background: #222222; color: white; font-size: 15px; cursor: pointer; }
        button:hover { background: #a45b45; }
        button:disabled { opacity: 0.6; cursor: not-allowed; }
        #message { margin-top: 18px; font-size: 14px; line-height: 1.5; overflow-wrap: anywhere; }
        .links { margin-top: 22px; text-align: center; font-size: 14px; }
        a { color: #a45b45; text-decoration: none; }
    </style>
</head>
<body>
<main class="card">
    <div class="logo">StyleSync</div>
    <h1>Forgot your password?</h1>
    <p class="subtitle">Enter your email and we will send you a reset link.</p>

    <form id="forgot-form">
        <label for="email">Email address</label>
        <input type="email" id="email" autocomplete="username" required>
        <button type="submit" id="submit-button">Send Reset Link</button>
    </form>

    <p id="message" role="status" aria-live="polite"></p>

    <div class="links"><a href="/login.html">Back to login</a></div>
</main>

<script>
    function errorText(data) {
        if (!data || typeof data !== "object") {
            return "";
        }
        if (data.message) {
            return data.message;
        }
        return Object.values(data).filter(v => typeof v === "string").join(" ");
    }
    const form = document.getElementById("forgot-form");
    const message = document.getElementById("message");
    const button = document.getElementById("submit-button");

    form.addEventListener("submit", async event => {
        event.preventDefault();
        message.textContent = "";
        button.disabled = true;

        try {
            const response = await fetch("/api/auth/forgot-password", {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({
                    email: document.getElementById("email").value.trim()
                })
            });

            const data = await response.json().catch(() => ({}));

            if (!response.ok) {
                throw new Error(errorText(data) ||
                    "Could not process your request.");
            }

            message.textContent = data.message;
        } catch (error) {
            message.textContent = error.message;
        } finally {
            button.disabled = false;
        }
    });
</script>
</body>
</html>
